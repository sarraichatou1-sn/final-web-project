{% extends "admin/base_admin.html" %}

{% block admin_content %}

<div class="admin-card">

  <h2 class="admin-title">
    {{ 'Modifier' if dep else 'Ajouter' }} un département
  </h2>

  <form method="POST">

    <div class="form-group">
      <label>Nom *</label>
      <input type="text" name="nom" value="{{ dep.nom if dep else '' }}"
             placeholder="Ex : Informatique" required>
    </div>

    <div class="form-group">
      <label>Description</label>
      <textarea name="description" placeholder="Présentation du département…">{{ dep.description if dep else '' }}</textarea>
    </div>

    <div class="form-group">
      <label>Responsable</label>
      <input type="text" name="responsable" value="{{ dep.responsable if dep else '' }}"
             placeholder="Ex : Dr. Diallo">
    </div>

    <div class="form-group">
      <label>Email de contact</label>
      <input type="email" name="contact" value="{{ dep.contact if dep else '' }}"
             placeholder="dep@ufr-sta.sn">
    </div>

    <div style="display:flex; gap:1rem; margin-top:1rem">
      <button type="submit" class="btn btn-primary">
        {{ 'Modifier' if dep else 'Ajouter' }}
      </button>
      <a href="{{ url_for('admin_departements') }}" class="btn btn-outline">Annuler</a>
    </div>

  </form>

</div>

{% endblock %}
