{% extends "admin/base_admin.html" %}

{% block admin_content %}

<div class="admin-card">

  <h2 class="admin-title">Photos — {{ album.titre }}</h2>

  <!-- Formulaire pour ajouter une photo -->
  <form method="POST" action="{{ url_for('admin_photo_ajouter', album_id=album.id) }}">
    <div class="form-group">
      <label>Nom du fichier (déjà présent dans static/images/)</label>
      <input type="text" name="fichier" placeholder="ex: photo1.jpg" required>
    </div>
    <div class="form-group">
      <label>Légende</label>
      <input type="text" name="legende">
    </div>
    <button type="submit" class="btn btn-primary">Ajouter la photo</button>
  </form>

  <hr style="margin:1.5rem 0">

  <!-- Affichage des photos déjà ajoutées -->
  {% if photos %}
    <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:1rem">
      {% for photo in photos %}
      <div style="border:1px solid var(--bord); border-radius:8px; overflow:hidden">

        <img src="{{ url_for('static', filename='images/' + photo.fichier) }}"
             style="width:100%; height:110px; object-fit:cover">

        <div style="padding:.5rem">
          <p style="font-size:.8rem">{{ photo.legende or photo.fichier }}</p>
          <a href="{{ url_for('admin_photo_supprimer', photo_id=photo.id, album_id=album.id) }}"
             class="btn-sm btn-del" onclick="return confirm('Supprimer ?')">
            Supprimer
          </a>
        </div>

      </div>
      {% endfor %}
    </div>
  {% else %}
    <p>Aucune photo pour le moment.</p>
  {% endif %}

  <a href="{{ url_for('admin_galerie') }}" class="btn btn-outline" style="margin-top:1.5rem">
    ← Retour aux albums
  </a>

</div>

{% endblock %}
